<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibWZpYzI1IiwiYSI6ImNtaGl6cjkzeTB3cHEya3F2NGg0bnZtcHgifQ.n_hXUOk7pbvFkf06XBvmcA'; 
    
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11', 
        center: [18.4196, -33.9241], 
        zoom: 16,
        pitch: 0,
        bearing: -20,
        scrollZoom: false 
    });

    // Animation variables
    let animationStep = 0;

    // --- 1. GENERATE THE PHOTON TEXTURE (The Shooting Star) ---
    // This creates a gradient image in memory so you don't need to upload a PNG
    function generatePhotonImage() {
        const width = 64; // Length of the "streak"
        const bytes = new Uint8Array(width * width * 4);

        for (let y = 0; y < width; y++) {
            for (let x = 0; x < width; x++) {
                const offset = (y * width + x) * 4;
                // Create a gradient: Fade in -> Bright White -> Fade out
                // This math creates a "comet" shape
                const intensity = Math.max(0, 1 - Math.abs(x - width / 2) / (width / 4));
                
                // Color: Mission White #faf7f5 (R:250, G:247, B:245)
                bytes[offset + 0] = 250; // Red
                bytes[offset + 1] = 247; // Green
                bytes[offset + 2] = 245; // Blue
                bytes[offset + 3] = intensity * 255; // Alpha (Transparency)
            }
        }
        return { width: width, height: width, data: bytes };
    }

    map.on('load', () => {
        
        // Add the generated image to the map style
        map.addImage('photon-streak', generatePhotonImage());

        // 1. 3D Buildings
        map.addLayer({
            'id': '3d-buildings',
            'source': 'composite',
            'source-layer': 'building',
            'filter': ['==', 'extrude', 'true'],
            'type': 'fill-extrusion',
            'minzoom': 15,
            'paint': {
                'fill-extrusion-color': '#0d332b',
                'fill-extrusion-height': ['get', 'height'],
                'fill-extrusion-base': ['get', 'min_height'],
                'fill-extrusion-opacity': 0.6
            }
        });

        // 2. DATA SOURCES
        
        // Traders
        map.addSource('traders-mock', {
            type: 'geojson',
            data: {
                "type": "FeatureCollection",
                "features": [
                    { "type": "Feature", "geometry": { "type": "Point", "coordinates": [18.4202, -33.9236] } },
                    { "type": "Feature", "geometry": { "type": "Point", "coordinates": [18.4207, -33.9231] } },
                    { "type": "Feature", "geometry": { "type": "Point", "coordinates": [18.4212, -33.9227] } }
                ]
            }
        });

        // Coffee Shops
        map.addSource('coffee-mock', {
            type: 'geojson',
            data: {
                "type": "FeatureCollection",
                "features": [
                    { "type": "Feature", "properties": { "name": "Motherland Coffee" }, "geometry": { "type": "Point", "coordinates": [18.4198, -33.9242] } },
                    { "type": "Feature", "properties": { "name": "Mojo Coffee" }, "geometry": { "type": "Point", "coordinates": [18.4195, -33.9240] } },
                    { "type": "Feature", "properties": { "name": "Happy Hippo" }, "geometry": { "type": "Point", "coordinates": [18.4199, -33.9239] } }
                ]
            }
        });

        // Delivery Bike Routes
        map.addSource('delivery-mock', {
            type: 'geojson',
            data: {
                "type": "FeatureCollection",
                "features": [
                    // Main flow
                    { "type": "Feature", "geometry": { "type": "LineString", "coordinates": [
                        [18.4195, -33.9243], [18.4199, -33.9239], [18.4202, -33.9236], [18.4206, -33.9232]
                    ]}},
                    // Offshoot 1
                    { "type": "Feature", "geometry": { "type": "LineString", "coordinates": [
                        [18.4199, -33.9239], [18.4194, -33.9235] 
                    ]}}
                ]
            }
        });

        // Counts Data
        map.addSource('counts-mock', {
            type: 'geojson',
            data: {
                "type": "FeatureCollection",
                "features": [
                    { "type": "Feature", "geometry": { "type": "Point", "coordinates": [18.4242, -33.9178] }, "properties": {"count": 1000} }
                ]
            }
        });

        // 3. ADD LAYERS

        // -- Delivery Background (The faint road) --
        map.addLayer({
            'id': 'delivery-base',
            'type': 'line',
            'source': 'delivery-mock',
            'paint': {
                'line-color': '#faf7f5',
                'line-width': 1,
                'line-opacity': 0 // Hidden initially
            }
        });

        // -- Delivery Photon (The moving light) --
        map.addLayer({
            'id': 'delivery-photon',
            'type': 'line',
            'source': 'delivery-mock',
            'paint': {
                'line-width': 6,
                'line-pattern': 'photon-streak', // Applies our generated image
                'line-opacity': 0 // Hidden initially
            }
        });

        // Coffee Shops
        map.addLayer({
            'id': 'coffee-layer',
            'type': 'circle',
            'source': 'coffee-mock',
            'paint': {
                'circle-radius': 7,
                'circle-color': '#ff8533', // Mission Orange
                'circle-opacity': 0, 
                'circle-stroke-width': 2,
                'circle-stroke-color': '#0d332b'
            }
        });

        // Traders
        map.addLayer({
            'id': 'traders-layer',
            'type': 'circle',
            'source': 'traders-mock',
            'paint': {
                'circle-radius': 8,
                'circle-color': '#f7b8d6', // Mission Pink
                'circle-opacity': 0, 
                'circle-stroke-width': 1,
                'circle-stroke-color': '#fff'
            }
        });

        // Counts
        map.addLayer({
            'id': 'counts-layer',
            'type': 'circle',
            'source': 'counts-mock',
            'paint': {
                'circle-radius': 25,
                'circle-color': '#ff8533', 
                'circle-opacity': 0, 
                'circle-blur': 0.4
            }
        });

        // 4. INTERACTION: COFFEE HOVER POPUPS
        const popup = new mapboxgl.Popup({
            closeButton: false,
            closeOnClick: false
        });

        map.on('mouseenter', 'coffee-layer', (e) => {
            map.getCanvas().style.cursor = 'pointer';
            const coordinates = e.features[0].geometry.coordinates.slice();
            const description = e.features[0].properties.name;

            while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
            }

            popup.setLngLat(coordinates)
                .setHTML(`<span class="popup-title">${description}</span>`)
                .addTo(map);
        });

        map.on('mouseleave', 'coffee-layer', () => {
            map.getCanvas().style.cursor = '';
            popup.remove();
        });


        // 5. NEW ANIMATION LOOP (Photon Effect)
        function animatePhoton() {
            animationStep = (animationStep + 1) % 512; // Cycle speed
            
            // This moves the pattern along the line
            if (map.getLayer('delivery-photon')) {
                // We divide by 10 to make it smoother
                map.setPaintProperty('delivery-photon', 'line-pattern-progress', animationStep / 10);
            }
            requestAnimationFrame(animatePhoton);
        }
        
        // Start animation (Wait a tiny bit for map to be ready)
        setTimeout(() => {
            // NOTE: "line-pattern" creates a static texture. 
            // To move it, we actually animate "line-translate" or use a different trick.
            // BUT, the easiest way in standard Mapbox to get a "flow" is actually 
            // moving the dash-array or using a pattern with a shift.
            
            // Actually, standard Mapbox GL doesn't support 'line-pattern-offset' natively in older versions.
            // Let's switch to the 'Moving Dash' method but make the dash look like a photon.
            // It's cleaner for this version.
            
            const dashArraySequence = [
                [0, 4, 3],
                [0.5, 4, 2.5],
                [1, 4, 2],
                [1.5, 4, 1.5],
                [2, 4, 1],
                [2.5, 4, 0.5],
                [3, 4, 0],
                [0, 0.5, 3, 3.5]
            ];
            
            let step = 0;
            function animateDash() {
                step = (step + 1) % 256; 
                // This technique slides the "gap" in the line
                if(map.getLayer('delivery-photon')) {
                     map.setPaintProperty('delivery-photon', 'line-pattern-transform', {
                        "y": step // This shifts the texture along the line!
                     });
                }
                requestAnimationFrame(animateDash);
            }
            animateDash();
        }, 1000);

    });

    // 6. SCROLL INTERACTION
    const scroller = scrollama();

    const locations = {
        'intro': { center: [18.4196, -33.9241], zoom: 16, pitch: 0 },
        'block1': { center: [18.4196, -33.9241], zoom: 18, pitch: 45 },
        'block2': { center: [18.4202, -33.9236], zoom: 18.5, pitch: 60 },
        'foreshore': { center: [18.4242, -33.9178], zoom: 17, pitch: 45 },
        'overview': { center: [18.422, -33.921], zoom: 15, pitch: 0 }
    };

    scroller
        .setup({
            step: '.step',
            offset: 0.5,
            debug: false
        })
        .onStepEnter(response => {
            const step = response.element;
            const loc = step.getAttribute('data-location');
            const layer = step.getAttribute('data-layer');

            if (locations[loc]) {
                map.flyTo({ ...locations[loc], essential: true, speed: 0.8 });
            }

            // 1. Intro: Hide all
            if (loc === 'intro') {
                toggleLayer('traders-layer', 0);
                toggleLayer('coffee-layer', 0);
                toggleLayer('delivery-base', 0);
                toggleLayer('delivery-photon', 0);
                toggleLayer('counts-layer', 0);
            }

            // 2. Block 1: Coffee + Delivery (SHOW THE PHOTON)
            if (layer === 'coffee-delivery') {
                toggleLayer('traders-layer', 0);
                toggleLayer('coffee-layer', 1);
                toggleLayer('delivery-base', 0.2); // Faint track
                toggleLayer('delivery-photon', 1); // Bright moving light
                toggleLayer('counts-layer', 0);
            }

            // 3. Block 2: Traders
            if (layer === 'traders') {
                toggleLayer('traders-layer', 1);
                toggleLayer('coffee-layer', 0);
                toggleLayer('delivery-base', 0);
                toggleLayer('delivery-photon', 0);
                toggleLayer('counts-layer', 0);
            }

            // 4. Foreshore: Counts
            if (layer === 'counts') {
                toggleLayer('traders-layer', 0);
                toggleLayer('coffee-layer', 0);
                toggleLayer('delivery-base', 0);
                toggleLayer('delivery-photon', 0);
                toggleLayer('counts-layer', 0.8);
            }

            // 5. Overview: Show all
            if (loc === 'overview') {
                toggleLayer('traders-layer', 0.5);
                toggleLayer('coffee-layer', 0.5);
                toggleLayer('delivery-base', 0);
                toggleLayer('delivery-photon', 0);
                toggleLayer('counts-layer', 0.5);
            }
            
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            step.classList.add('active');
        });

    function toggleLayer(id, opacity) {
        if (map.getLayer(id)) {
            // Check if it's a line layer or circle layer to use the right property
            const type = map.getLayer(id).type;
            const prop = type === 'line' ? 'line-opacity' : 'circle-opacity';
            map.setPaintProperty(id, prop, opacity);
        }
    }

</script>
